name: "Test Suite"

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run tests on"
        required: false
        default: "test"
      install_jq:
        description: "Whether to force install jq (for testing purposes)"
        required: false
        default: ""

jobs:
  tests:
    name: "Test ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: "${{ inputs.branch }}"

      - name: print versions
        shell: bash
        run: |
          uname
          uname -a
          aws --version
          jq --version
          jq --help

      - name: invalidate PATHS
        uses: ./
        env:
          DEBUG: "1"
          PATHS: /robots* /index.html
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          INSTALL_JQ: "${{ inputs.install_jq }}"

      - name: create path files
        shell: bash
        run: |
          cat << EOF > paths1.txt
          /robots.txt
          /*.xml
          EOF

          cat << EOF > paths2.txt
          /robots.txt /*.xml
          EOF

      - name: invalidate PATHS_FROM 1
        uses: ./
        env:
          DEBUG: "1"
          PATHS_FROM: paths1.txt
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: invalidate PATHS_FROM 2
        uses: ./
        env:
          DEBUG: "1"
          PATHS_FROM: paths2.txt
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: configure aws credentials (access key)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - name: invalidate PATHS using aws creds
        uses: ./
        env:
          DEBUG: "1"
          PATHS: /robots* /index.html
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}

      - name: configure aws credentials (oidc)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: TestSessionName
          aws-region: "us-east-1"

      - name: invalidate PATHS using oidc creds
        uses: ./
        env:
          DEBUG: "1"
          PATHS: /robots* /index.html
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
